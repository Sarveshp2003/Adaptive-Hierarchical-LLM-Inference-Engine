name: Build Native Library and Run Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-matrix:
    name: Build native (matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Windows runner: using preinstalled build tools (MSVC)."

      - name: Build native library (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build_native_library.sh || true
          ./build_native_library.sh

      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          build_native_library.bat

      - name: Upload native lib artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptive_scheduler-${{ matrix.os }}
          path: lib

  run-integration:
    name: Run Phase2 Integration Test
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux native artifact
        uses: actions/download-artifact@v4
        with:
          name: adaptive_scheduler-ubuntu-latest
          path: lib

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java sources
        run: |
          mkdir -p bin
          find src/main/java -name "*.java" | xargs javac -d bin

      - name: Run Phase2ProductionIntegrationTest
        run: |
          java -Djava.library.path=lib -cp bin com.adaptivellm.scheduler.Phase2ProductionIntegrationTest

      - name: Upload test output (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-integration-logs
          path: |
            lib
            bin
