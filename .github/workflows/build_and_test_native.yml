name: Build Native Library and Run Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-matrix:
    name: Build native (matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopenblas-dev liblapack-dev libomp-dev

      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Windows runner: using preinstalled build tools (MSVC)."

      - name: Build native library (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          set -x

          echo "=== Diagnostics ==="
          echo "USER: $(whoami)"
          echo "PWD: $(pwd)"
          echo "JAVA_HOME: $JAVA_HOME"
          java -version || true
          javac -version || true
          which g++ || true
          g++ --version || true
          ls -lah || true
          cat /etc/os-release || true

          echo "=== Begin build ==="

          mkdir -p lib

          echo "[COMPILE] Building adaptive_scheduler native lib"
          g++ -shared -fPIC -O2 \
            -I"$JAVA_HOME/include" \
            -I"$JAVA_HOME/include/linux" \
            -I"src/main/cpp/headers" \
            -o lib/libadaptive_scheduler.so \
            src/main/cpp/adaptive_scheduler.cpp \
            -pthread

          echo "[COMPILE] Building adaptive_engine shim"
          g++ -shared -fPIC -O2 \
            -o lib/libadaptive_engine.so \
            native-engine/shim/adaptive_engine_shim.cpp \
            -pthread

          echo "[COMPILE] Building llama_wrapper engine"
          g++ -shared -fPIC -O2 \
            -I"src/main/cpp/headers" \
            -o lib/libadaptive_engine_llama.so \
            native-engine/llama_wrapper/llama_wrapper.cpp \
            -pthread

          echo "[COMPILE] Attempting full llama.cpp CMake build"
          mkdir -p build/llama_build
          cmake -S native-engine/llama_wrapper -B build/llama_build || true
          cmake --build build/llama_build --target adaptive_engine_llama -- -j2 || true

          echo "Built libraries:"
          ls -lah lib

      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build_native_library.bat

      - name: Upload native lib artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptive_scheduler-${{ matrix.os }}
          path: lib

  run-integration:
    name: Run Phase2 Integration Test
    runs-on: ubuntu-latest
    needs: build-matrix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux native artifact
        uses: actions/download-artifact@v4
        with:
          name: adaptive_scheduler-ubuntu-latest
          path: lib

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java sources
        run: |
          mkdir -p bin
          find src/main/java -name "*.java" | xargs javac -d bin

      - name: Run Phase2ProductionIntegrationTest
        run: |
          java -Djava.library.path=lib \
            -cp bin \
            com.adaptivellm.scheduler.Phase2ProductionIntegrationTest

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-integration-logs
          path: |
            lib
            bin

  system-check:
    name: Full system check
    runs-on: ubuntu-latest
    needs: build-matrix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux native artifact
        uses: actions/download-artifact@v4
        with:
          name: adaptive_scheduler-ubuntu-latest
          path: lib

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java sources
        run: |
          mkdir -p bin
          find src/main/java -name "*.java" | xargs javac -d bin

      - name: Run extended integration test
        run: |
          java \
            -Dphase2.decisions=1000 \
            -Djava.library.path=lib \
            -cp bin \
            com.adaptivellm.scheduler.Phase2ProductionIntegrationTest

      - name: Upload system check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-system-check-logs
          path: |
            lib
            bin

  model-smoke:
    name: Model-loaded smoke test
    runs-on: ubuntu-latest
    needs: build-matrix

    env:
      LLAMA_MODEL_URL: ${{ secrets.LLAMA_MODEL_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux native artifact
        uses: actions/download-artifact@v4
        with:
          name: adaptive_scheduler-ubuntu-latest
          path: lib

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java sources
        run: |
          mkdir -p bin
          find src/main/java -name "*.java" | xargs javac -d bin

      - name: Download model and run smoke test
        shell: bash
        run: |
          if [ -z "$LLAMA_MODEL_URL" ]; then
            echo "LLAMA_MODEL_URL not set -- skipping model smoke test"
            exit 0
          fi

          mkdir -p lib/model

          echo "Downloading model..."
          curl -L "$LLAMA_MODEL_URL" -o lib/model/test_model.gguf

          export LLAMA_MODEL_PATH="$(pwd)/lib/model/test_model.gguf"

          echo "LLAMA_MODEL_PATH=$LLAMA_MODEL_PATH"

          java \
            -Djava.library.path=lib \
            -cp bin \
            com.adaptivellm.scheduler.Phase2ProductionIntegrationTest

      - name: Upload model smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-model-smoke-logs
          path: |
            lib
            bin
