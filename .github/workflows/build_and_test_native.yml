name: Build Native Library and Run Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-matrix:
    name: Build native (matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Windows runner: using preinstalled build tools (MSVC)."

      - name: Build native library (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          set -x
          echo "=== Diagnostics ==="
          echo "USER: $(whoami)"
          echo "PWD: $(pwd)"
          echo "JAVA_HOME: $JAVA_HOME"
          echo "Java version:"; java -version || true
          echo "javac version:"; javac -version || true
          echo "which g++:"; which g++ || true
          echo "g++ --version:"; g++ --version || true
          echo "ls root:"; ls -lah || true
          cat /etc/os-release || true
          echo "=== Begin build ==="
          mkdir -p lib
          echo "[COMPILE] Building adaptive_scheduler native lib"
          g++ -shared -fPIC -O2 -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -I"src/main/cpp/headers" -o lib/libadaptive_scheduler.so src/main/cpp/adaptive_scheduler.cpp -pthread || (echo "adaptive_scheduler build failed"; exit 1)
          echo "[COMPILE] Building adaptive_engine shim"
          g++ -shared -fPIC -O2 -o lib/libadaptive_engine.so native-engine/shim/adaptive_engine_shim.cpp -pthread || (echo "adaptive_engine_shim build failed"; exit 1)
          echo "[COMPILE] Building llama_wrapper engine"
          g++ -shared -fPIC -O2 -I"src/main/cpp/headers" -o lib/libadaptive_engine_llama.so native-engine/llama_wrapper/llama_wrapper.cpp -pthread || (echo "llama_wrapper build failed"; exit 1)
          echo "[INFO] Built lib contents:" 
          ls -lah lib || true

      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          build_native_library.bat

      - name: Upload native lib artifact
        uses: actions/upload-artifact@v4
        with:
          name: adaptive_scheduler-${{ matrix.os }}
          path: lib

  run-integration:
    name: Run Phase2 Integration Test
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux native artifact
        uses: actions/download-artifact@v4
        with:
          name: adaptive_scheduler-ubuntu-latest
          path: lib

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java sources
        run: |
          mkdir -p bin
          find src/main/java -name "*.java" | xargs javac -d bin

      - name: Run Phase2ProductionIntegrationTest (dry run)
        run: |
          java -Djava.library.path=lib -cp bin com.adaptivellm.scheduler.Phase2ProductionIntegrationTest

      - name: Upload test output (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-integration-logs
          path: |
            lib
            bin

  system-check:
    name: Full system check (extended)
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux native artifact
        uses: actions/download-artifact@v4
        with:
          name: adaptive_scheduler-ubuntu-latest
          path: lib

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java sources
        run: |
          mkdir -p bin
          find src/main/java -name "*.java" | xargs javac -d bin

      - name: Run Phase2ProductionIntegrationTest (extended)
        run: |
          # Run with 1000 decisions for a longer system check
          java -Dphase2.decisions=1000 -Djava.library.path=lib -cp bin com.adaptivellm.scheduler.Phase2ProductionIntegrationTest

      - name: Upload system-check output (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-system-check-logs
          path: |
            lib
            bin
